name: Cirque Quality Gate CI

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-rf-unit-and-coverage:
    name: Virtual RF & Home Topology Unit Tests (>=95% Coverage Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dbus python3-gi dbus socat psmisc
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install coverage docker pyroute2 flask requests protobuf

      - name: Run Virtual BT, Virtual Wi-Fi & Home Topology Unit Tests with >=95% Coverage Gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/python -m unittest -v cirque/capabilities/test/test_bluetooth_capability.py
          .venv/bin/python -m coverage run \
            --source=cirque/virtual_wifi,cirque/home \
            -m unittest -v cirque/virtual_wifi/test_virtual_wifi_server.py
          .venv/bin/python -m coverage report \
            --include="*/cirque/virtual_wifi/*,*/cirque/home/virtual_home_topology.py,*/cirque/home/__init__.py" \
            --omit="*/test_*" \
            --fail-under=95 -m

  virtual-home-docker-e2e:
    name: Virtual Home 2-Docker E2E (Virtual BT + Virtual Wi-Fi)
    runs-on: ubuntu-latest
    needs: virtual-rf-unit-and-coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dbus python3-gi dbus socat psmisc iproute2 iputils-ping
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install coverage docker pyroute2 flask requests protobuf

      - name: Build Virtual RF Node Docker Image
        run: |
          docker build -t project-chip/chip-cirque-device-base \
            -f cirque/resources/Dockerfile.virtual_rf_node cirque/resources

      - name: Run Virtual Wi-Fi Capability Docker Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/python -m unittest -v cirque/capabilities/test/test_wifi_capability.py

      - name: Run 2-Docker Virtual Home E2E (BLE Discovery + GATT + WPA2 + CLI Validation)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/python -m unittest -v examples/test_virtual_home_ble_wifi_e2e.py
          .venv/bin/python examples/run_virtual_home_interactive.py --help
